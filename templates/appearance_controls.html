<section class="info-card appearance-card" aria-labelledby="appearanceTitle">
 <div class="info-card-header"><span class="info-card-icon"><i data-lucide="activity" aria-hidden="true"></i></span><div><h3 id="appearanceTitle">Appearance</h3><p>Choose your workspace theme.</p></div></div>
 <div class="info-card-body">
  <fieldset class="appearance-options"><legend>Choose your workspace theme</legend>
   <label><input type="radio" name="appearance" value="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Light</span><small>Clean and bright interface</small></label>

   <label><input type="radio" name="appearance" value="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5m-5 0h10"/></svg><span>System Default</span><small>Follows your device’s theme</small></label>

  <p class="appearance-help">Saved in this browser. New browsers start in Light. System default follows your device’s theme and may appear Dark. Choose Light to keep the workspace light. Printed reports remain light.</p>

 </div>
</section>
